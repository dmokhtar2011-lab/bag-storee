<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f6f2"><title>إتمام الطلب | حكاية</title><link rel="stylesheet" href="style.css"></head>
<body class="checkout-page"><div class="announcement" id="announcement"></div><header class="header"><a class="wordmark" href="index.html"><span class="mark">ح</span><span id="storeName">حكاية</span></a><a class="back-link" href="index.html">← العودة للتسوق</a></header><main class="checkout-wrap"><div class="checkout-heading"><span class="kicker">خطوة أخيرة</span><h1>إتمام طلبك</h1><p>اكتبي بيانات التوصيل، وسيتسجل طلبك في المتجر.</p></div><div class="checkout-layout"><section class="form-card"><h2>بيانات التوصيل</h2><form id="orderForm"><label>الاسم بالكامل<input name="name" autocomplete="name" required placeholder="الاسم الذي نستلم به الطلب"></label><label>رقم الموبايل<input name="phone" autocomplete="tel" inputmode="tel" required placeholder="01xxxxxxxxx"></label><label>العنوان بالتفصيل<input name="address" autocomplete="street-address" required placeholder="المحافظة، المنطقة، الشارع ورقم العقار"></label><label>ملاحظات للطلب <span class="optional">اختياري</span><textarea name="notes" rows="3" placeholder="اللون المفضل أو وقت مناسب للتوصيل"></textarea></label><button class="button dark full submit-order" type="submit">تأكيد الطلب <span>←</span></button><p class="form-note">هنستلم طلبك في لوحة إدارة المتجر ونتواصل معك على رقم الموبايل.</p></form></section><aside class="summary-card"><h2>ملخص حقيبتك</h2><div id="orderItems"></div><div class="summary-total"><span>الإجمالي</span><b id="orderTotal">٠ ج.م</b></div><div class="secure-note">✳ بياناتك تستخدم لتجهيز هذا الطلب فقط</div></aside></div></main><footer><a class="wordmark" href="index.html"><span class="mark">ح</span><span id="footerName">حكاية</span></a><span id="footerNote">تفاصيل صغيرة، حكايات كبيرة.</span><small>© 2026 · جميع الحقوق محفوظة</small></footer><div class="toast" id="toast"></div><script type="module" src="store.js"></script></body></html>
